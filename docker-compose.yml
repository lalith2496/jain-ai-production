services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jainai}
      POSTGRES_USER: ${POSTGRES_USER:-jainai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jainai}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-jainai}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, neo4j, redis]
    volumes: ["./backend:/app"]

  crawler:
    build: ./crawler
    env_file: .env
    depends_on: [api]
    volumes: ["./crawler:/app"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]

  admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5174:5174"]
    volumes: ["./admin:/app"]

volumes:
  pgdata:
  neo4jdata:
